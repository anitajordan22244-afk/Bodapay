version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: bodapay-db
    environment:
      POSTGRES_USER: bodapay
      POSTGRES_PASSWORD: bodapay_password
      POSTGRES_DB: bodapay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bodapay"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bodapay-cache
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: bodapay-api
    environment:
      PORT: 8080
      DATABASE_URL: postgres://bodapay:bodapay_password@postgres:5432/bodapay?sslmode=disable
      REDIS_URL: redis:6379
      STELLAR_NETWORK: testnet
      HORIZON_URL: https://horizon-testnet.stellar.org
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
    container_name: bodapay-ui
    environment:
      REACT_APP_API_URL: http://localhost:8080/api/v1
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    container_name: bodapay-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    container_name: bodapay-promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: bodapay-grafana
    ports:
      - "3200:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  postgres_data:
